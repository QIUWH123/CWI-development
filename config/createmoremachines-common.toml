#Global multiplier for all machine stress impacts
#Range: 0.0 ~ 8.0
stress_multiplier = 1.0
#Auto-pickup radius for the end-tier depot
#Range: 0.0 ~ 16.0
pickup_range = 3.0
#Whether depots accept dropped items that land on them
depot_pickup = true
#Max items a belt segment can carry for items whose stack size is lower (1 = vanilla)
#Range: 1 ~ 256
belt_stack_override = 64
#Allow belt/funnel to merge items that carry NBT (e.g. sequenced assembly intermediates)
belt_merge_nbt = false

